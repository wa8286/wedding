<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy & Debbie 婚禮邀請函</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #d4a373;
            --secondary: #8da399;
            --bg-light: #fbfbf9;
            --text-dark: #4a4a4a;
            --white-glow: rgba(255, 255, 255, 0.88);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --gold-btn-bg: linear-gradient(135deg, #e6c594 0%, #c49a6c 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
            line-height: 1.8;
            overflow-x: hidden;
        }

        .en-font {
            font-family: 'Cormorant Garamond', serif;
        }

        .no-wrap {
            white-space: nowrap;
        }

        /* 1. 毛玻璃導航列 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            padding: 15px 0;
        }

        .navbar a {
            color: var(--text-dark);
            text-decoration: none;
            margin: 0 20px;
            font-size: 0.95rem;
            letter-spacing: 2px;
            transition: color 0.3s;
            font-weight: 600;
        }

        .navbar a:hover {
            color: var(--primary);
        }

        /* 2. 全螢幕封面（優化版面避免遮擋人物） */
        .hero {
            min-height: 100vh;
            position: relative;
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('https://i.postimg.cc/vZbLtxZt/11.png');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 讓文字靠上，計時器適度懸浮 */
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 90px 20px 30px 20px;
        }

        .hero-text-container {
            margin-top: 20px;
        }

        .hero-names {
            font-size: 3.0rem;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero-subnames {
            font-size: 2.0rem;
            letter-spacing: 4px;
            margin-bottom: 15px;
            color: #ffffff;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .hero-slogan {
            font-size: 1.5rem;
            letter-spacing: 3px;
            color: #ffffff;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* 3. 計時器視覺（精簡高度與寬度，避免壓人物） */
        .timer-container {
            display: flex;
            gap: 12px;
            max-width: 520px;
            width: 100%;
            justify-content: center;
            padding: 0 10px;
            margin-bottom: 20px; /* 留出底部空間 */
        }

        .timer-card {
            background: var(--white-glow);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 10px 8px;
            flex: 1;
            min-width: 65px;
            max-width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .timer-box {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: space-around;
        }

        .timer-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.0rem;
            font-weight: 600;
            color: var(--primary);
            line-height: 1;
        }

        .timer-divider {
            width: 1px;
            height: 22px;
            background-color: rgba(141, 163, 153, 0.4);
        }

        .timer-label {
            font-size: 0.7rem;
            color: var(--secondary);
            writing-mode: vertical-lr;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* 4. 卡片區塊 */
        .section {
            padding: 90px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .v-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
            padding: 50px 40px;
            text-align: center;
            border: 1px solid rgba(212, 163, 115, 0.15);
            position: relative;
            overflow: hidden;
        }

        .v-card::before {
            content: '';
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 1px solid rgba(141, 163, 153, 0.2);
            border-radius: 12px;
            pointer-events: none;
        }

        .leaf-decor {
            position: absolute;
            width: 70px;
            opacity: 0.75;
            pointer-events: none;
            z-index: 1;
        }

        .leaf-top-left {
            top: -10px;
            left: -10px;
        }

        .leaf-bottom-right {
            bottom: -10px;
            right: -10px;
            transform: rotate(180deg);
        }

        .section-title {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 40px;
            letter-spacing: 3px;
            position: relative;
            z-index: 2;
        }

        .info-item {
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-item i {
            color: var(--secondary);
            font-size: 1.4rem;
            margin-bottom: 10px;
            display: block;
        }

        .info-item p {
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* 5. 表單與按鈕 */
        form {
            position: relative;
            z-index: 2;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-dark);
            letter-spacing: 1px;
        }

        .form-label span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.85rem;
            color: var(--secondary);
            margin-left: 5px;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            transition: border-color 0.3s;
            background-color: #fff;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        select.form-control {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M0 3l5 5 5-5z' fill='%238da399'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 12px;
        }

        .conditional-group {
            display: none;
            border-left: 2px solid var(--primary);
            padding-left: 15px;
            margin-top: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-submit {
            background: var(--gold-btn-bg);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-family: 'Noto Serif TC', serif;
            letter-spacing: 3px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 6px 20px rgba(196, 154, 108, 0.4);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-submit:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(196, 154, 108, 0.5);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.85rem;
            color: var(--secondary);
            letter-spacing: 1px;
        }

        /* 📱 手機版防遮擋人物專屬排版 (RWD) */
        @media (max-width: 600px) {
            .hero {
                /* 背景定位往上/往右對焦，確保新娘人物與海報完美露出 */
                background-position: 70% top;
                padding-top: 80px;
                padding-bottom: 20px;
            }
            .hero-names { font-size: 2.2rem; }
            .hero-subnames { font-size: 1.3rem; margin-bottom: 10px; }
            .hero-slogan { font-size: 1.1rem; }
            
            /* 精簡手機版計時器體積，防壓人物 */
            .timer-container {
                gap: 8px;
                margin-bottom: 10px;
            }
            .timer-card {
                padding: 8px 4px;
                min-width: 55px;
                border-radius: 8px;
            }
            .timer-num { font-size: 1.5rem; }
            .timer-label { font-size: 0.65rem; }
            
            .v-card { padding: 40px 20px; }
            .section { padding: 50px 15px; }
            .navbar a { margin: 0 10px; font-size: 0.85rem; }
            .form-row { flex-direction: column; gap: 0; }
            .leaf-decor { width: 50px; }
        }

        @media (max-width: 380px) {
            .hero-names { font-size: 1.8rem; }
            .hero-subnames { font-size: 1.1rem; }
            .hero-slogan { font-size: 1.0rem; }
            .timer-card { padding: 6px 2px; min-width: 48px; }
            .timer-num { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#about">關於我們</a>
        <a href="#details">婚禮詳情</a>
        <a href="#rsvp">出席回函</a>
    </nav>

    <header class="hero" id="about">
        <div class="hero-text-container">
            <h1 class="hero-names en-font">Jimmy & Debbie</h1>
            <div class="hero-subnames">林群閔 & 楊韻玄</div>
            <div class="hero-slogan">人群之中＿只想玄你</div>
        </div>
        
        <div class="timer-container">
            <div class="timer-card">
                <div class="timer-box">
                    <span class="timer-num" id="days">00</span>
                    <div class="timer-divider"></div>
                    <span class="timer-label">天 DAYS</span>
                </div>
            </div>
            <div class="timer-card">
                <div class="timer-box">
                    <span class="timer-num" id="hours">00</span>
                    <div class="timer-divider"></div>
                    <span class="timer-label">時 HRS</span>
                </div>
            </div>
            <div class="timer-card">
                <div class="timer-box">
                    <span class="timer-num" id="minutes">00</span>
                    <div class="timer-divider"></div>
                    <span class="timer-label">分 MINS</span>
                </div>
            </div>
            <div class="timer-card">
                <div class="timer-box">
                    <span class="timer-num" id="seconds">00</span>
                    <div class="timer-divider"></div>
                    <span class="timer-label">秒 SECS</span>
                </div>
            </div>
        </div>
    </header>

    <section class="section" id="details">
        <div class="v-card">
            <svg class="leaf-decor leaf-top-left" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10,80 Q30,40 80,10 Q60,50 10,80 Z" fill="#d4a373"/>
                <path d="M10,80 Q50,60 90,40 Q50,70 10,80 Z" fill="#c49a6c"/>
            </svg>
            <svg class="leaf-decor leaf-bottom-right" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10,80 Q30,40 80,10 Q60,50 10,80 Z" fill="#d4a373"/>
                <path d="M10,80 Q50,60 90,40 Q50,70 10,80 Z" fill="#c49a6c"/>
            </svg>

            <h2 class="section-title">婚禮詳情</h2>
            
            <div class="info-item">
                <i class="fa-regular fa-calendar-days"></i>
                <p><b>2026 年 11 月 29 日</b></p>
                <p style="font-size: 0.95rem; color: var(--secondary); margin-top: 5px;">
                    12:00 入席 ｜ 12:30 準時開席
                </p>
            </div>
            
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <p class="no-wrap"><b>台北市</b></p>
                <p class="no-wrap" style="font-size: 0.95rem; color: #777; margin-top: 5px;">詳細宴會廳地址與交通資訊會於正式喜帖中公告</p>
            </div>
        </div>
    </section>

    <section class="section" id="rsvp" style="padding-top: 0;">
        <div class="v-card">
            <svg class="leaf-decor leaf-top-left" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10,80 Q30,40 80,10 Q60,50 10,80 Z" fill="#d4a373"/>
                <path d="M10,80 Q50,60 90,40 Q50,70 10,80 Z" fill="#c49a6c"/>
            </svg>
            <svg class="leaf-decor leaf-bottom-right" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10,80 Q30,40 80,10 Q60,50 10,80 Z" fill="#d4a373"/>
                <path d="M10,80 Q50,60 90,40 Q50,70 10,80 Z" fill="#c49a6c"/>
            </svg>

            <h2 class="section-title">出席回函</h2>
            
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {alert('填寫成功！非常期待您的蒞臨。');}"></iframe>
            
            <form action="https://docs.google.com/forms/d/e/1FAIpQLSfqYAI8oZADSqTcx1xG07r4GaMJxgCO3DZxDPF0pAOLAvF4eg/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
                
                <div class="form-group">
                    <label class="form-label">姓名<span>NAME</span></label>
                    <input type="text" name="entry.887296731" class="form-control" required placeholder="請輸入您的姓名">
                </div>

                <div class="form-group">
                    <label class="form-label">電子信箱<span>EMAIL</span></label>
                    <input type="email" name="entry.431495492" class="form-control" required placeholder="請輸入您的 Email">
                </div>

                <div class="form-group">
                    <label class="form-label">賓客歸類<span>RELATIONSHIP</span></label>
                    <select name="entry.740676292" class="form-control" required>
                        <option value="" disabled selected>請選擇</option>
                        <option value="男方好友">男方好友</option>
                        <option value="女方好友">女方好友</option>
                        <option value="男方家人親戚">男方家人親戚</option>
                        <option value="女方家人親戚">女方家人親戚</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">參加午宴人數<span>ATTENDANCE NUMBER</span></label>
                    <select name="entry.733303240" id="attendance_count" class="form-control" required onchange="toggleAttendanceLogic()">
                        <option value="" disabled selected>請選擇人數</option>
                        <option value="0">無法出席，祝福你們</option>
                        <option value="1">1 人</option>
                        <option value="2">2 人</option>
                        <option value="3">3 人</option>
                        <option value="4">4 人</option>
                    </select>
                </div>

                <div id="conditional_diet_amenity" class="conditional-group">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">葷食人數<span>MEAL (MEAT)</span></label>
                            <select name="entry.771437183" class="form-control">
                                <option value="0">0 位</option>
                                <option value="1" selected>1 位</option>
                                <option value="2">2 位</option>
                                <option value="3">3 位</option>
                                <option value="4">4 位</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">素食人數<span>MEAL (VEGETARIAN)</span></label>
                            <select name="entry.943134898" class="form-control">
                                <option value="0" selected>0 位</option>
                                <option value="1">1 位</option>
                                <option value="2">2 位</option>
                                <option value="3">3 位</option>
                                <option value="4">4 位</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">是否需要兒童椅<span>CHILD SEAT</span></label>
                        <select name="entry.1079849285" id="child_seat_select" class="form-control" onchange="toggleChildSeatLogic()">
                            <option value="不需要" selected>不需要</option>
                            <option value="需要">需要</option>
                        </select>
                    </div>

                    <div id="conditional_child_seat_count" class="conditional-group" style="margin-top: -10px; margin-bottom: 25px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">兒童椅張數<span>NUMBER OF CHILD SEATS</span></label>
                            <select name="entry.1996855183" class="form-control">
                                <option value="1" selected>1 張</option>
                                <option value="2">2 張</option>
                                <option value="3">3 張</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">喜帖索取<span>INVITATION STYLE</span></label>
                        <select name="entry.780173523" id="invitation_style" class="form-control" onchange="toggleAddressLogic()">
                            <option value="" disabled selected>請選擇喜帖形式</option>
                            <option value="電子喜帖">不需要，電子喜帖即可</option>
                            <option value="紙本喜帖（請於下一題填寫地址）">需要，請寄送紙本喜帖</option>
                        </select>
                    </div>

                    <div id="conditional_address" class="conditional-group">
                        <div class="form-group">
                            <label class="form-label">喜帖寄送地址<span>MAILING ADDRESS</span></label>
                            <input type="text" name="entry.249757274" id="address_input" class="form-control" placeholder="請輸入收件地址">
                        </div>
                    </div>

                </div>

                <button type="submit" class="btn-submit">確認送出 Submit</button>
            </form>
        </div>
    </section>

    <footer>
        <p class="en-font">&copy; 2026 Jimmy & Debbie Wedding. All Rights Reserved.</p>
    </footer>

    <script>
        var submitted = false;

        // 1. 倒數計時器
        const targetDate = new Date('2026-11-29T12:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference < 0) {
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 2. 表單邏輯
        function toggleAttendanceLogic() {
            const countSelect = document.getElementById('attendance_count');
            const conditionalBlock = document.getElementById('conditional_diet_amenity');
            const invitationStyle = document.getElementById('invitation_style');
            
            if (parseInt(countSelect.value) > 0) {
                conditionalBlock.style.display = 'block';
                invitationStyle.setAttribute('required', 'required');
            } else {
                conditionalBlock.style.display = 'none';
                invitationStyle.removeAttribute('required');
            }
        }

        function toggleChildSeatLogic() {
            const seatSelect = document.getElementById('child_seat_select');
            const seatCountBlock = document.getElementById('conditional_child_seat_count');
            
            if (seatSelect.value === '需要') {
                seatCountBlock.style.display = 'block';
            } else {
                seatCountBlock.style.display = 'none';
            }
        }

        function toggleAddressLogic() {
            const styleSelect = document.getElementById('invitation_style');
            const addressBlock = document.getElementById('conditional_address');
            const addressInput = document.getElementById('address_input');
            
            if (styleSelect.value.includes('紙本喜帖')) {
                addressBlock.style.display = 'block';
                addressInput.setAttribute('required', 'required');
            } else {
                addressBlock.style.display = 'none';
                addressInput.removeAttribute('required');
                addressInput.value = '';
            }
        }
    </script>
</body>
</html>
